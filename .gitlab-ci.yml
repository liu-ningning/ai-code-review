stages:
  - validate
  - build
  - deploy
  - rollback

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - when: never

include:
  - local: .gitlab/ci/jobs.yml
  - local: .gitlab/cd/jobs.yml

variables:
  APP_IMAGE_REPOSITORY: works/ai-code-review
  PNPM_VERSION: 10.33.0

default:
  tags:
    - ai-tools
  image: alpine:3.20
  interruptible: true
