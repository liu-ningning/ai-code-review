# 业务镜像构建相关的变更范围。
.app_image_changes: &app_image_changes
  - src/**/*
  - package.json
  - pnpm-lock.yaml
  - tsconfig.json
  - Dockerfile
  - docker-compose.yml
  - .gitlab/**/*
  - .gitlab-ci.yml

# 代码校验相关的变更范围。
.validate_changes: &validate_changes
  - src/**/*
  - tests/**/*
  - package.json
  - pnpm-lock.yaml
  - tsconfig.json
  - eslint.config.js
  - .gitlab/**/*
  - .gitlab-ci.yml

# Node 类校验任务共用模板。
.validate_template:
  stage: validate
  image: node:24-bookworm-slim
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm install --frozen-lockfile

# Lint 任务。
lint:
  extends: .validate_template
  script:
    - pnpm lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *validate_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main")'
      changes: *validate_changes

# 测试任务。
test:
  extends: .validate_template
  script:
    - pnpm test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *validate_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main")'
      changes: *validate_changes

# 构建校验任务，确保 TypeScript 产物在进镜像前可生成。
build:check:
  extends: .validate_template
  script:
    - pnpm build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *validate_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main")'
      changes: *validate_changes

# 业务镜像构建模板。
.build_app_template:
  stage: build
  interruptible: true
  before_script: []
  script:
    - sh ./.gitlab/ci/build-app-image.sh

# 测试环境业务镜像构建任务。
build:app:test:
  extends: .build_app_template
  needs: ["lint", "test", "build:check"]
  variables:
    IMAGE_TAG_STABLE: test
    IMAGE_TAG_VERSION: test-${CI_COMMIT_SHORT_SHA}
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      changes: *app_image_changes

# 生产环境业务镜像构建任务。
build:app:prod:
  extends: .build_app_template
  needs: ["lint", "test", "build:check"]
  interruptible: false
  variables:
    IMAGE_TAG_STABLE: prod
    IMAGE_TAG_VERSION: prod-${CI_COMMIT_SHORT_SHA}
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes: *app_image_changes
